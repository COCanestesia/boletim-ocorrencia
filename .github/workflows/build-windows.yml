name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.16,<7"

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable application
        run: pyinstaller --noconfirm --clean COCBoletim.spec

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe não foi encontrado após instalar o Inno Setup."
          }

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION precisa seguir MAJOR.MINOR.PATCH"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer\boletim_coc.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Instalar_Boletim_COC_${{ env.APP_VERSION }}
          path: dist-installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Check whether this version already has a release
        id: release_check
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Boletim de Ocorrência COC v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: dist-installer/*.exe
